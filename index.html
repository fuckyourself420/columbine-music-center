<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CMC</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--fg) var(--bg)}
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 'Courier Prime','Courier New',monospace;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;border:1px solid var(--fg)}
button{background:none;border:0;color:var(--fg);font:inherit;cursor:pointer;padding:1px 6px;white-space:nowrap}
button:hover,.on{background:var(--fg);color:var(--bg)}
.tb,.nav{display:flex;align-items:center;border-bottom:1px solid var(--fg);padding:4px 12px}
.tb{font-size:17px;justify-content:space-between}.nav{flex-wrap:wrap}.nav i{font-style:normal;margin:0 6px}.sp{flex:1}
#st{color:var(--dm);font-size:13px}
#main{flex:1;min-height:0;overflow:hidden}
.lay{display:flex;height:100%}
.side{width:210px;flex:none;border-right:1px solid var(--fg);padding:10px 12px;overflow:auto}
.ctr{flex:1;min-width:0;display:flex;flex-direction:column}
.info{width:290px;flex:none;border-left:1px solid var(--fg);padding:10px 14px;overflow:auto}
h3{margin:0 0 8px;font-weight:400;font-size:17px;border-bottom:1px solid var(--fg);padding-bottom:6px}
.it{padding:2px 8px;cursor:pointer}.it:hover{background:var(--hv)}.it.on:hover{background:var(--fg)}.qf{margin-top:18px}
.ch{padding:8px 12px;border-bottom:1px solid var(--fg);font-size:17px}
.gw{flex:1;overflow:auto;padding:14px}
.gd{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.al{text-align:center;cursor:pointer;padding:6px;border:1px solid var(--bg)}.al:hover{border-color:var(--fg)}
.al .cap{margin-top:6px}
.cov{aspect-ratio:1;border:1px solid var(--fg);overflow:hidden}.cov img{width:100%;height:100%;object-fit:cover;display:block}
.noart{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dm)}
.pg{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--fg);padding:6px 12px}
.tw{flex:1;overflow:auto;min-height:0}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--bg);text-align:left;font-weight:400;border-bottom:1px solid var(--fg);padding:6px 8px;cursor:pointer;white-space:nowrap}
td{padding:2px 8px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
tr[data-t]{cursor:pointer}tr[data-t]:hover td{background:var(--hv)}tr.on td,tr.on:hover td{background:var(--fg);color:var(--bg)}
hr{border:0;border-top:1px solid var(--fg);margin:12px 0}p{margin:8px 0}.dim{color:var(--dm)}
.wf{display:block;width:100%;height:60px;cursor:pointer}.wf.big{height:140px;border-top:1px solid var(--fg);border-bottom:1px solid var(--fg)}
.btns{margin-top:8px;display:flex;gap:6px}
#pl{border-top:1px solid var(--fg);padding:8px 12px}.pr1{display:flex;align-items:center;gap:14px}
.ba{width:56px;height:56px;flex:none;cursor:pointer;overflow:hidden}.ba .cov{width:100%;height:100%;aspect-ratio:auto;border:0}.ba img{width:100%;height:100%;object-fit:cover;display:block}.ba .noart{width:100%;height:100%}
.bi{width:220px;flex:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.pr1 .wf{flex:1;height:50px;min-width:0}.bm{text-align:right;flex:none}
.prog{height:6px;border:1px solid var(--fg);margin:6px 0}.prog i{display:block;height:100%;background:var(--fg);width:0}
.pr2{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:8px;background:var(--bg);border:1px solid var(--fg);vertical-align:middle;margin:0 6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:16px;background:var(--fg);border:0}
input[type=range]::-moz-range-thumb{width:8px;height:16px;background:var(--fg);border:0;border-radius:0}
input[type=text],input[type=password]{background:var(--bg);color:var(--fg);border:1px solid var(--fg);font:inherit;padding:4px 8px;width:100%;outline:0}
.pv{display:flex;flex-direction:column;height:100%;padding:14px;min-height:0}
.pl1{display:flex;gap:20px;margin-bottom:12px}.cov.big{width:min(28vh,260px);flex:none}
.tt{font-size:26px;line-height:1.2}.kv{margin:10px 0;font-size:18px}.ctl{display:flex;gap:4px;align-items:center;padding:8px 0;flex-wrap:wrap}
.pg2{padding:16px;overflow:auto;height:100%}pre{font:inherit;margin:0}
.scan #app::after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(#0000 0 2px,#0003 2px 3px)}
.tb{-webkit-app-region:drag;padding-left:84px}.tb span:last-child{display:none}
@media(max-width:860px){.info{display:none}.side{width:150px}}
@media(max-width:600px){.side{display:none}.bi{width:100px}.bm{display:none}}

:root{--fg:#ffffff;--bg:#000000;--dm:#8a8a8a;--hv:#2a2a2a}
.ch{display:flex;align-items:center;gap:8px}.zm{cursor:zoom-in}
.th{display:inline-block;vertical-align:middle;width:30px;height:30px;margin-right:8px;border:1px solid var(--fg);overflow:hidden;cursor:zoom-in;flex:none}
.th .cov{width:100%;height:100%;aspect-ratio:auto;border:0}.th img{width:100%;height:100%;object-fit:cover;display:block}.th .noart{width:100%;height:100%;font-size:7px;line-height:1}
.lr{display:flex;align-items:center;gap:14px;padding:4px 12px;cursor:pointer;border-bottom:1px solid var(--hv)}
.lr:hover{background:var(--hv)}.lr.on,.lr.on:hover{background:var(--fg);color:var(--bg)}
.lr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lr .lt{flex:2}.lr .th{flex:none;width:44px;height:44px;margin:0}
.al{content-visibility:auto;contain-intrinsic-size:auto 210px}
.pv{overflow:auto}.pv>.tw{flex:1 0 220px}.cov.big{width:min(24vh,230px)}.bi{width:clamp(140px,22vw,320px)}
#zm{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:44px 28px 28px;-webkit-app-region:no-drag}#zm[hidden]{display:none}
.zw{display:flex;gap:28px;max-width:1100px;margin:0 auto;flex-wrap:wrap}.zc{width:min(560px,86vw);flex:none}.zl{flex:1;min-width:280px}.zc .cov{width:100%}.zl .tw{flex:none;max-height:55vh}
